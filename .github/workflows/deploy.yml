# Publicação no GitHub Pages: roda quando algo entra na branch main.
# O site publicado contém só o código do painel, nunca dados: o TXT é
# aberto pelo usuário no próprio navegador.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sigilo
      - run: npm test
      # Chaves do Google Drive (opcionais): "Variables" do repositório
      # (Settings > Secrets and variables > Actions > Variables). Sem elas, o
      # botão do Drive não aparece e a página continua sem conexão nenhuma.
      # Não são senhas (o Google as deixa visíveis no site); a proteção é a
      # restrição ao endereço do painel feita no Google Cloud. Ver docs/google-drive.md.
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_NUMERO_PROJETO: ${{ vars.GOOGLE_NUMERO_PROJETO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
